name: Build release EXE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to build
        required: true
        default: master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Read and check version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [xml]$manifest = Get-Content 'FluentFlyoutMSIX/Package.appxmanifest'
          $version = ($manifest.Package.Identity.Version -split '\.')[0..2] -join '.'
          if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package version v$version"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish self-contained x64 EXE
        shell: pwsh
        run: |
          dotnet publish 'FluentFlyoutWPF/FluentFlyout.csproj' `
            --configuration 'GitHub Release' `
            --runtime win-x64 `
            --self-contained true `
            --output "$env:RUNNER_TEMP/publish" `
            -p:Platform=x64 `
            -p:Version=$env:APP_VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release asset
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'publish/FluentFlyout.exe'
          if (-not (Test-Path $exe)) { throw "Published EXE is missing: $exe" }
          New-Item -ItemType Directory -Path 'release' -Force | Out-Null
          $asset = 'release/FluentFlyout_{0}_x64.exe' -f $env:APP_VERSION
          Copy-Item $exe $asset

      - name: Save build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: FluentFlyout_${{ env.APP_VERSION }}_x64
          path: release/*.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download EXE
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: FluentFlyout_*_x64
          path: release
          merge-multiple: true

      - name: Attach EXE to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*.exe)
          test "${#assets[@]}" -eq 1
          gh release upload "$RELEASE_TAG" "${assets[0]}" --clobber --repo "$GITHUB_REPOSITORY"
